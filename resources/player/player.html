<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>VodLink Player</title>
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://i.ytimg.com">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }

    html,
    body,
    #player-root,
    #video-stage {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #player-root,
    #video-stage {
      position: relative;
    }

    lite-youtube {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease;
      --lite-youtube-aspect-ratio: auto;
      --lite-youtube-frame-shadow-visible: no;
    }

    #player-root.player-visible lite-youtube {
      opacity: 1;
    }

    lite-youtube::part(playButton) {
      display: none;
    }

    #interaction-shield {
      position: absolute;
      z-index: 5;
      inset: 0;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }

    #controls {
      position: absolute;
      z-index: 10;
      right: 14px;
      bottom: 12px;
      left: 14px;
      display: grid;
      grid-template-columns: auto minmax(80px, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 9px 12px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 8px;
      color: #fff;
      background: rgba(0, 0, 0, .72);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .28);
      font: 13px/1.2 Inter, "Segoe UI", system-ui, sans-serif;
      user-select: none;
    }

    #toggle {
      min-width: 32px;
      border: 0;
      padding: 2px 4px;
      color: #fff;
      background: transparent;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    #timeline {
      width: 100%;
      margin: 0;
      accent-color: #7c3aed;
      cursor: pointer;
    }

    #time {
      min-width: 94px;
      color: rgba(255, 255, 255, .92);
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }

    #message {
      position: absolute;
      z-index: 20;
      inset: 0;
      display: none;
      place-items: center;
      box-sizing: border-box;
      padding: 32px;
      color: #d6dae4;
      background: rgba(0, 0, 0, .82);
      font: 15px/1.45 Inter, "Segoe UI", system-ui, sans-serif;
      text-align: center;
      white-space: pre-wrap;
    }

    #message.visible {
      display: grid;
    }

    #message.transient {
      pointer-events: none;
      background: rgba(0, 0, 0, .62);
    }
  </style>

<body>
  <main id="player-root">
    <section id="video-stage" aria-label="VodLink VOD player"></section>
    <button id="interaction-shield" type="button" aria-label="Play or pause"></button>
    <div id="controls" role="group" aria-label="Playback controls">
      <button id="toggle" type="button" aria-label="Play or pause">&#9654;</button>
      <input id="timeline" type="range" min="0" max="1" step="0.01" value="0" aria-label="Video position">
      <span id="time">0:00 / 0:00</span>
    </div>
    <div id="message" class="visible">Select a VOD to watch</div>
  </main>

  <script>
    (() => {
      'use strict';

      const root = document.getElementById('player-root');
      const stage = document.getElementById('video-stage');
      const interactionShield = document.getElementById('interaction-shield');
      const toggle = document.getElementById('toggle');
      const timeline = document.getElementById('timeline');
      const timeLabel = document.getElementById('time');
      const message = document.getElementById('message');
      const appOrigin = 'https://vodlink.app';
      const qualityRank = [
        'highres', 'hd2160', 'hd1440', 'hd1080', 'hd720',
        'large', 'medium', 'small', 'tiny'
      ];

      let bridge = null;
      let lite = null;
      let player = null;
      let playerReady = false;
      let attachPromise = null;
      let pendingLoad = null;
      let currentVideoId = '';
      let lastTime = 0;
      let lastDuration = 0;
      let scrubbing = false;
      let endFreezeInProgress = false;
      let reportTimer = null;
      let messageTimer = null;
      let resizeObserver = null;
      let lastQualityDebug = '';
      let frameMessageCount = 0;
      const bootTimeMs = Date.now();

      function debug(event, details = {}) {
        let text = '';
        try {
          text = JSON.stringify({
            t: Date.now() - bootTimeMs,
            event,
            videoId: currentVideoId,
            details,
          });
        } catch (_) {
          text = String(event);
        }
        try { console.log('[VodLink lite-youtube] ' + text); } catch (_) {}
        try {
          if (bridge && bridge.debugLog) bridge.debugLog('Player', text);
        } catch (_) {}
      }

      window.addEventListener('message', event => {
        if (!event.data || event.data.vodlinkVideoFrame !== true) return;
        if (frameMessageCount < 8) {
          frameMessageCount += 1;
          debug('frame-video-state', event.data);
        }
      });

      function formatTime(seconds) {
        const value = Math.max(0, Math.floor(Number(seconds) || 0));
        const hours = Math.floor(value / 3600);
        const minutes = Math.floor((value % 3600) / 60);
        const secs = String(value % 60).padStart(2, '0');
        return hours > 0
          ? `${hours}:${String(minutes).padStart(2, '0')}:${secs}`
          : `${minutes}:${secs}`;
      }

      function showMessage(text, transient = false) {
        if (messageTimer) {
          clearTimeout(messageTimer);
          messageTimer = null;
        }
        const clean = String(text || '').trim();
        message.textContent = clean;
        message.classList.toggle('visible', !!clean);
        message.classList.toggle('transient', !!clean && transient);
        if (clean && transient) {
          messageTimer = setTimeout(() => {
            message.classList.remove('visible', 'transient');
            messageTimer = null;
          }, 4200);
        }
      }

      function validYouTubeId(value) {
        return /^[A-Za-z0-9_-]{6,}$/.test(String(value || '').trim());
      }

      function bestQuality(levels) {
        const available = Array.isArray(levels) ? levels : [];
        return qualityRank.find(level => available.includes(level))
          || available.find(level => level && level !== 'auto')
          || '';
      }

      function applyPlaybackPreferences(target) {
        if (!target) return;
        try {
          if (Number(target.getPlaybackRate?.()) !== 1) {
            target.setPlaybackRate?.(1);
          }
        } catch (_) {}

        try {
          const levels = target.getAvailableQualityLevels?.() || [];
          const best = bestQuality(levels);
          if (best) {
            target.setPlaybackQualityRange?.(best, best);
            target.setPlaybackQuality?.(best);
          }
          const current = target.getPlaybackQuality?.() || 'unknown';
          const snapshot = `${current}|${levels.join(',')}`;
          if (snapshot !== lastQualityDebug) {
            lastQualityDebug = snapshot;
            debug('quality', { requested: best || 'adaptive', current, levels });
          }
        } catch (_) {}
      }

      function forceHighResolutionSurface() {
        if (!lite || !lite.shadowRoot) return;
        const iframe = lite.shadowRoot.querySelector('iframe');
        if (!iframe) return;

        const hostWidth = lite.clientWidth;
        const hostHeight = lite.clientHeight;
        if (hostWidth < 32 || hostHeight < 32) {
          requestAnimationFrame(forceHighResolutionSurface);
          return;
        }

        const virtualWidth = Math.max(3840, hostWidth);
        const virtualHeight = virtualWidth * hostHeight / hostWidth;
        const scale = hostWidth / virtualWidth;
        iframe.style.setProperty('width', `${virtualWidth}px`, 'important');
        iframe.style.setProperty('height', `${virtualHeight}px`, 'important');
        iframe.style.setProperty('transform', `scale(${scale})`, 'important');
        iframe.style.setProperty('transform-origin', 'top left', 'important');
        iframe.style.setProperty('pointer-events', 'none', 'important');
        iframe.setAttribute('tabindex', '-1');
        iframe.blur();
        lite.style.overflow = 'hidden';
      }

      function waitForYouTubeApi() {
        return new Promise((resolve, reject) => {
          const deadline = Date.now() + 20000;
          const timer = setInterval(() => {
            if (window.YT && typeof window.YT.Player === 'function') {
              clearInterval(timer);
              resolve();
              return;
            }
            if (Date.now() >= deadline) {
              clearInterval(timer);
              reject(new Error('YouTube IFrame API timed out'));
            }
          }, 50);
        });
      }

      function updateToggle(state) {
        const playing = window.YT && state === window.YT.PlayerState.PLAYING;
        toggle.textContent = playing ? '\u275a\u275a' : '\u25b6';
      }

      function handlePlayerState(event) {
        const state = event ? event.data : -1;
        updateToggle(state);
        debug('state', { state });

        if (window.YT && state === window.YT.PlayerState.PLAYING) {
          endFreezeInProgress = false;
          showMessage('');
          setTimeout(() => {
            try {
              if (player && player.getPlayerState() === window.YT.PlayerState.PLAYING) {
                root.classList.add('player-visible');
              }
            } catch (_) {}
          }, 300);
          return;
        }

        if (window.YT && state === window.YT.PlayerState.ENDED && !endFreezeInProgress) {
          endFreezeInProgress = true;
          const duration = Math.max(0, Number(event.target.getDuration?.()) || lastDuration);
          const finalFrame = Math.max(0, duration - 0.05);
          try {
            event.target.seekTo(finalFrame, false);
            event.target.pauseVideo();
            lastTime = finalFrame;
            if (!scrubbing) {
              timeline.max = String(Math.max(1, duration));
              timeline.value = String(finalFrame);
              timeLabel.textContent = `${formatTime(finalFrame)} / ${formatTime(duration)}`;
            }
          } catch (_) {}
        }
      }

      function startReporting() {
        if (reportTimer) return;
        reportTimer = setInterval(() => {
          if (!playerReady || !player) return;
          try {
            lastTime = Math.max(0, Number(player.getCurrentTime?.()) || 0);
            lastDuration = Math.max(0, Number(player.getDuration?.()) || 0);
            if (!scrubbing) {
              timeline.max = String(Math.max(1, lastDuration));
              timeline.value = String(lastTime);
              timeLabel.textContent = `${formatTime(lastTime)} / ${formatTime(lastDuration)}`;
            }
            if (bridge && bridge.onTimeUpdate) bridge.onTimeUpdate(lastTime);
            applyPlaybackPreferences(player);
          } catch (error) {
            debug('time-report-error', { message: String(error) });
          }
        }, 250);
      }

      function applyPendingLoad() {
        if (!playerReady || !player || !pendingLoad) return;
        const request = pendingLoad;
        pendingLoad = null;
        endFreezeInProgress = false;
        showMessage('');

        try {
          if (currentVideoId !== request.videoId) {
            currentVideoId = request.videoId;
            player.loadVideoById({
              videoId: request.videoId,
              startSeconds: request.seek,
              suggestedQuality: 'highres',
            });
          } else {
            player.seekTo(request.seek, true);
            player.playVideo();
          }
          applyPlaybackPreferences(player);
          debug('load-applied', request);
        } catch (error) {
          debug('load-error', { message: String(error), request });
          showMessage('Could not start this YouTube VOD.');
        }
      }

      async function attachYouTubePlayer() {
        if (attachPromise) return attachPromise;
        attachPromise = (async () => {
          await waitForYouTubeApi();
          const iframe = lite && lite.shadowRoot
            ? lite.shadowRoot.querySelector('iframe')
            : null;
          if (!iframe) throw new Error('lite-youtube did not create its iframe');

          forceHighResolutionSurface();
          resizeObserver = new ResizeObserver(forceHighResolutionSurface);
          resizeObserver.observe(lite);

          player = new window.YT.Player(iframe, {
            events: {
              onReady(event) {
                player = event.target;
                playerReady = true;
                document.body.tabIndex = -1;
                document.body.focus({ preventScroll: true });
                applyPlaybackPreferences(player);
                startReporting();
                applyPendingLoad();
                debug('ready');
              },
              onStateChange: handlePlayerState,
              onError(event) {
                debug('youtube-error', { code: event ? event.data : 'unknown' });
                showMessage(`YouTube player error ${event ? event.data : 'unknown'}.`);
              },
              onAutoplayBlocked() {
                debug('autoplay-blocked');
                showMessage('Click the video to start playback.', true);
              },
            },
          });
        })().catch(error => {
          attachPromise = null;
          debug('attach-error', { message: String(error) });
          showMessage('The YouTube player could not be loaded.');
          throw error;
        });
        return attachPromise;
      }

      async function createLitePlayer(videoId, seek) {
        await customElements.whenDefined('lite-youtube');
        if (lite) return;

        // Qt WebEngine 6.8/6.9 embeds Chromium versions where credentialless
        // YouTube frames never advance their media element past HAVE_NOTHING.
        // Keep the actual lite-youtube component, but use its normal credential
        // mode just like the successful native-browser proof.
        const liteType = customElements.get('lite-youtube');
        const isNativeWebView2 = !!(window.chrome && window.chrome.webview);
        if (!isNativeWebView2
            && liteType
            && !liteType.prototype.vodlinkCredentialModePatched) {
          const generateIframe = liteType.prototype.generateIframe;
          liteType.prototype.generateIframe = function (...args) {
            return generateIframe.apply(this, args).replace(' credentialless', '');
          };
          liteType.prototype.vodlinkCredentialModePatched = true;
        }

        lite = document.createElement('lite-youtube');
        lite.id = 'vod';
        lite.setAttribute('videoid', videoId);
        lite.setAttribute('videotitle', 'VodLink VOD');
        lite.setAttribute('videoplay', 'Play VOD');
        lite.setAttribute('posterquality', 'maxresdefault');
        lite.setAttribute('videoStartAt', String(Math.max(0, Math.floor(seek))));
        lite.setAttribute('disablenoscript', '');
        lite.setAttribute(
          'params',
          'autoplay=1&controls=0&enablejsapi=1&playsinline=1&rel=0&fs=0'
          + '&cc_load_policy=0&iv_load_policy=3&disablekb=1&showinfo=0'
          + '&modestbranding=1&vq=hd2160'
          + '&origin=https%3A%2F%2Fvodlink.app'
          + '&widget_referrer=https%3A%2F%2Fvodlink.app%2F'
        );
        lite.addEventListener('liteYoutubeIframeLoaded', () => {
          debug('lite-iframe-loaded');
          attachYouTubePlayer().catch(() => {});
        }, { once: true });
        stage.appendChild(lite);
        currentVideoId = videoId;
        lite.addIframe();
      }

      async function loadVideo(videoId, seek) {
        const cleanId = String(videoId || '').trim();
        const cleanSeek = Math.max(0, Number(seek) || 0);
        if (!validYouTubeId(cleanId)) {
          showMessage('This VOD has an invalid YouTube id.');
          return;
        }

        pendingLoad = { videoId: cleanId, seek: cleanSeek };
        debug('load-requested', pendingLoad);
        if (!lite) {
          showMessage('Loading YouTube player...');
          try {
            await createLitePlayer(cleanId, cleanSeek);
          } catch (error) {
            debug('create-error', { message: String(error) });
          }
          return;
        }
        applyPendingLoad();
      }

      function seek(seconds) {
        const target = Math.max(0, Number(seconds) || 0);
        if (!playerReady || !player) return;
        try {
          player.seekTo(target, true);
          player.playVideo();
        } catch (_) {}
      }

      function play() {
        if (!playerReady || !player) return;
        try {
          root.classList.remove('player-visible');
          player.playVideo();
        } catch (_) {}
      }

      function pause() {
        if (!playerReady || !player) return;
        try { player.pauseVideo(); } catch (_) {}
      }

      function togglePlayback() {
        if (!playerReady || !player || !window.YT) return;
        try {
          if (player.getPlayerState() === window.YT.PlayerState.PLAYING) {
            player.pauseVideo();
          } else {
            root.classList.remove('player-visible');
            player.playVideo();
          }
        } catch (_) {}
      }

      interactionShield.addEventListener('click', togglePlayback);
      toggle.addEventListener('click', togglePlayback);
      document.addEventListener('contextmenu', event => event.preventDefault(), true);

      timeline.addEventListener('pointerdown', event => {
        scrubbing = true;
        try { timeline.setPointerCapture(event.pointerId); } catch (_) {}
      });
      timeline.addEventListener('input', () => {
        if (!scrubbing) scrubbing = true;
        timeLabel.textContent = `${formatTime(timeline.value)} / ${formatTime(timeline.max)}`;
      });

      function commitTimelineSeek(event) {
        if (!scrubbing) return;
        scrubbing = false;
        if (event && typeof event.pointerId === 'number') {
          try { timeline.releasePointerCapture(event.pointerId); } catch (_) {}
        }
        seek(Number(timeline.value));
      }

      timeline.addEventListener('pointerup', commitTimelineSeek);
      timeline.addEventListener('pointercancel', () => { scrubbing = false; });
      timeline.addEventListener('change', commitTimelineSeek);

      window.vodlink = {
        loadVideo,
        seek,
        play,
        pause,
        toggle: togglePlayback,
        message(text) {
          const clean = String(text || '').trim();
          const persistent = /^select a vod/i.test(clean);
          showMessage(clean, !persistent);
        },
        cacheVideos() {
          // A single controllable iframe is deliberately reused across POVs.
          // YouTube's loadVideoById keeps switches authoritative and avoids
          // multiple simultaneous decoders.
        },
      };

      window.addEventListener('error', event => {
        debug('window-error', {
          message: event.message,
          source: event.filename,
          line: event.lineno,
        });
      });
      window.addEventListener('unhandledrejection', event => {
        debug('unhandled-rejection', { reason: String(event.reason) });
      });

      function finishQtConnection(channel) {
        bridge = channel.objects.bridge;
        bridge.loadRequested.connect(window.vodlink.loadVideo);
        bridge.seekRequested.connect(window.vodlink.seek);
        bridge.playRequested.connect(window.vodlink.play);
        bridge.pauseRequested.connect(window.vodlink.pause);
        bridge.messageRequested.connect(window.vodlink.message);
        bridge.cacheRequested.connect(window.vodlink.cacheVideos);
        bridge.ready();
        debug('bridge-ready');
      }

      function connectNativeWebView2() {
        if (!(window.chrome && window.chrome.webview)) return false;

        const post = payload => {
          try { window.chrome.webview.postMessage(payload); } catch (_) {}
        };
        bridge = {
          ready() { post({ type: 'ready' }); },
          onTimeUpdate(seconds) { post({ type: 'time', seconds }); },
          debugLog(category, text) { post({ type: 'debug', category, text }); },
        };
        window.chrome.webview.addEventListener('message', event => {
          const request = event.data || {};
          switch (request.command) {
            case 'load':
              window.vodlink.loadVideo(request.videoId, request.seek);
              break;
            case 'seek':
              window.vodlink.seek(request.seconds);
              break;
            case 'play':
              window.vodlink.play();
              break;
            case 'pause':
              window.vodlink.pause();
              break;
            case 'message':
              window.vodlink.message(request.text);
              break;
            case 'cache':
              window.vodlink.cacheVideos(request.videoIds);
              break;
          }
        });
        bridge.ready();
        debug('webview2-bridge-ready');
        return true;
      }

      function connectQtWebChannel() {
        const script = document.createElement('script');
        script.src = 'qrc:///qtwebchannel/qwebchannel.js';
        script.onload = () => {
          if (!window.qt || !qt.webChannelTransport || !window.QWebChannel) {
            showMessage('VodLink could not connect to the player.');
            return;
          }
          new QWebChannel(qt.webChannelTransport, finishQtConnection);
        };
        script.onerror = () => showMessage('VodLink could not load its player bridge.');
        document.head.appendChild(script);
      }

      if (!connectNativeWebView2()) {
        connectQtWebChannel();
      }
    })();
  </script>
</body>
</html>
