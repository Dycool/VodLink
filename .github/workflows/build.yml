name: Build Rust client

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 Rust package
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out source without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Enforce first-party safety invariants
        run: python scripts/check-rust-safety.py

      - name: Install pinned OBS build helper
        shell: pwsh
        run: cargo install cargo-obs-build --git https://github.com/libobs-rs/libobs-rs --rev 0f306186d2f1414fb51e717fafd43f48cfce3114 --locked

      - name: Stage private OBS runtime
        shell: pwsh
        run: cargo obs-build build --out-dir target/release

      - name: Build release client
        shell: pwsh
        run: cargo build --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Package installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v')) { $env:GITHUB_REF_NAME.Substring(1) } else { '0.2.0-dev' }
          ./scripts/package-windows.ps1 -Version $version

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: VodLink-Windows-x64
          path: installer-output/VodLink-Windows-x64-Setup.exe
          if-no-files-found: error
